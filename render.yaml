# Blueprint do Render. Ao conectar o repositório, ele lê este arquivo sozinho.
services:
  - type: web
    name: screenshare-signaling
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    # --include=dev: o TypeScript é devDependency e precisa existir no build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
